<!DOCTYPE html>
<html>
<head>
    <title>Driver/BIOS Update Pipeline</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .container { max-width: 800px; margin: auto; }
        button { padding: 10px; margin: 10px 0; }
        #status { margin-top: 20px; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
<div class="container">
    <h1>Driver/BIOS Update Pipeline</h1>
    
    <button onclick="testConnection()" style="background-color: #4CAF50; color: white;">Test Connection</button>
    
    <label>Azure Storage Container (Blob):</label>
    <input type="text" id="containerName" placeholder="e.g., driver-updates" style="width: 100%; margin: 10px 0;">
    
    <label>Select ZIP File:</label>
    <input type="text" id="blobPath" placeholder="folder/my-update.zip" style="width: 100%; margin: 10px 0;">
    
    <button onclick="processUpdate()">Process Update</button>
    
    <div id="status">Ready</div>
</div>

<script>
    // Always use the Azure Function App endpoint, not the Static Web App
    const FUNCTION_URL = "https://payloaderpro.azurewebsites.net/api/processUpdate";
    const HEALTH_URL = "https://payloaderpro.azurewebsites.net/api/health";

    async function testConnection() {
        document.getElementById('status').innerHTML = 'Testing connection...';
        console.log('Testing health check at:', HEALTH_URL);
        try {
            const response = await fetch(HEALTH_URL, { mode: 'cors' });
            const data = await response.json();
            document.getElementById('status').innerHTML = `✅ Connection OK: ${data.message}`;
            console.log('Health check response:', data);
        } catch (error) {
            console.error('Connection test failed:', error);
            document.getElementById('status').innerHTML = `❌ Connection failed: ${error.message}. Function URL: ${HEALTH_URL}`;
        }
    }

    async function processUpdate() {
        const container = document.getElementById('containerName').value;
        const blobPath = document.getElementById('blobPath').value;
        
        if (!container || !blobPath) {
            alert('Please enter container name and blob path');
            return;
        }
        
        document.getElementById('status').innerHTML = 'Processing... This may take a few minutes.';
        console.log('Calling function URL:', FUNCTION_URL);
        
        try {
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    containerName: container,
                    sourceBlobPath: blobPath
                })
            });

            const text = await response.text();
            let result = null;
            try {
                result = JSON.parse(text);
            } catch (parseError) {
                // If the response is not JSON, keep the raw text for diagnostics.
            }

            if (!response.ok) {
                const serverMessage = result?.message || result?.error || text || response.statusText;
                throw new Error(`HTTP ${response.status}: ${serverMessage}`);
            }

            if (!result || !result.outputFile) {
                throw new Error(`Invalid response from server: ${text}`);
            }

            document.getElementById('status').innerHTML = 
                `✅ Complete! Output in ${container}/out/${result.outputFile}`;
        } catch (error) {
            console.error('Fetch error:', error);
            console.error('Error stack:', error.stack);
            let errorMsg = error.message;
            if (error.message === 'Failed to fetch') {
                if (window.location.protocol === 'file:') {
                    errorMsg = 'Cannot fetch from file:// protocol. Run from a local server: python -m http.server 8000, then visit http://localhost:8000/index.html';
                } else {
                    errorMsg = `Failed to connect to ${FUNCTION_URL}. Ensure Azure Function is running and CORS is enabled.`;
                }
            }
            document.getElementById('status').innerHTML = `❌ Error: ${errorMsg}`;
        }
    }
</script>
</body>
</html>
