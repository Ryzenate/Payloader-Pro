<div class="frame">
    <div class="frame-title">Targeting Configurations</div>
    <div class="target-columns">
        <div class="form-group">
            <label for="stationSelect">Station (System) Names</label>
            <select id="stationSelect" class="target-select" multiple></select>
            <p class="helper-text" style="font-size:11px; color:#666;">Ctrl+Click to multiselect custom deployment nodes.</p>
        </div>
        <div class="form-group">
            <label for="programSelect">Program Names</label>
            <select id="programSelect" class="target-select" multiple></select>
            <p class="helper-text" style="font-size:11px; color:#666;">Ctrl+Click to bind task rules to specific pipelines.</p>
        </div>
    </div>
</div>

<script>
    (function() {
        const stationSelect = document.getElementById('stationSelect');
        const programSelect = document.getElementById('programSelect');

        // Safe parser for raw lines within INI layout configuration files
        function parseIniLines(text) {
            return text.split(/\r?\n/)
                .map(line => line.trim())
                .filter(line => line && !line.startsWith(';') && !line.startsWith('#'));
        }

        fetch('stations.ini')
            .then(res => res.ok ? res.text() : '')
            .then(data => {
                stationSelect.innerHTML = '';
                const lines = parseIniLines(data);
                if (lines.length === 0) {
                    stationSelect.innerHTML = '<option disabled>No stations found inside stations.ini</option>';
                    return;
                }
                lines.forEach(line => {
                    const opt = document.createElement('option');
                    opt.value = line; opt.text = line;
                    if (window.AppState.selectedStations.includes(line)) opt.selected = true;
                    stationSelect.add(opt);
                });
            }).catch(() => {
                stationSelect.innerHTML = '<option disabled>stations.ini lookup skipped</option>';
            });

        fetch('programs.ini')
            .then(res => res.ok ? res.text() : '')
            .then(data => {
                programSelect.innerHTML = '';
                const lines = parseIniLines(data);
                if (lines.length === 0) {
                    programSelect.innerHTML = '<option disabled>No programs found inside programs.ini</option>';
                    return;
                }
                lines.forEach(line => {
                    const opt = document.createElement('option');
                    opt.value = line; opt.text = line;
                    if (window.AppState.selectedPrograms.includes(line)) opt.selected = true;
                    programSelect.add(opt);
                });
            }).catch(() => {
                programSelect.innerHTML = '<option disabled>programs.ini lookup skipped</option>';
            });

        window.dispatchEvent(new CustomEvent('pageModuleReady'));
    })();
</script>
